---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operator.superphenix.net
  resources:
  - clusterconnections
  - clusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.superphenix.net
  resources:
  - clusterconnections/finalizers
  - clusters/finalizers
  verbs:
  - update
- apiGroups:
  - operator.superphenix.net
  resources:
  - clusterconnections/status
  - clusters/status
  verbs:
  - get
  - patch
  - update
