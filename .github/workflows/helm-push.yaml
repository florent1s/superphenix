name: Push Helm Charts to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Helm version
        id: prep
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            # Remove leading 'v' if present for Helm versioning
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package and Push Charts
        run: |
          CHARTS_DIR="components/system"
          REGISTRY="oci://ghcr.io/${{ github.repository_owner }}/charts"
          VERSION="${{ steps.prep.outputs.version }}"

          for chart in "$CHARTS_DIR"/*; do
            if [ -d "$chart" ]; then
              echo "Processing chart: $chart"
              
              # Extract chart name
              CHART_NAME=$(basename "$chart")
              
              # Package the chart with the determined version
              # We use --version and --app-version to ensure consistency with the request
              helm package "$chart" --version "$VERSION" --app-version "$VERSION"
              
              # Push the packaged chart to GHCR
              # Note: helm package creates a .tgz in the current directory
              helm push "${CHART_NAME}-${VERSION}.tgz" "$REGISTRY"
              
              # Cleanup the packaged file
              rm "${CHART_NAME}-${VERSION}.tgz"
            fi
          done
