name: Push Helm Charts to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  push-charts:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Charts
        run: |
          set -x
          REGISTRY="oci://ghcr.io/${{ github.repository_owner }}/charts"

          # Identify changed files if not a manual trigger or new branch/tag
          ALL_CHANGED=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger: processing all charts."
            ALL_CHANGED=true
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
              echo "New branch/tag or initial push: processing all charts."
              ALL_CHANGED=true
            else
              echo "Detecting changes between $BEFORE and ${{ github.sha }}"
              CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi

          find components -name "Chart.yaml" | while read -r chart_file; do
            chart_dir=$(dirname "$chart_file")
            
            if [[ "$ALL_CHANGED" != "true" ]]; then
              if ! echo "$CHANGED_FILES" | grep -qE "^$chart_dir(/|$)"; then
                echo "Skipping chart in $chart_dir: no changes detected."
                continue
              fi
            fi

            echo "Processing chart in: $chart_dir"

            # Extract chart name and version from Chart.yaml
            # We use yq to reliably parse the YAML file
            CHART_NAME=$(yq -r '.name' "$chart_file")
            CHART_VERSION_IN_FILE=$(yq -r '.version' "$chart_file")

            # Check for dependencies and update them if necessary
            if yq -r '.dependencies | length > 0' "$chart_file" | grep -q "true"; then
              echo "Dependencies found for $CHART_NAME, updating..."
              helm dependency update "$chart_dir"
            fi

            # Determine SPX-VERSION
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
              SPX_VERSION="${{ github.ref_name }}"
              # Remove leading 'v' if present for Helm versioning
              SPX_VERSION="${SPX_VERSION#v}"
            else
              SPX_VERSION="0.0.0"
            fi

            # Determine the final version to push
            if [[ "$CHART_VERSION_IN_FILE" == "0.0.0" ]]; then
              VERSION="$SPX_VERSION"
            else
              VERSION="${CHART_VERSION_IN_FILE}"
            fi

            echo "Pushing $CHART_NAME with version $VERSION"

            # Package the chart with the determined version
            helm package "$chart_dir" --version "$VERSION" --app-version "$VERSION"

            # Push the packaged chart to GHCR
            # Note: helm package creates a .tgz in the current directory
            helm push "${CHART_NAME}-${VERSION}.tgz" "$REGISTRY"

            # Cleanup the packaged file
            rm "${CHART_NAME}-${VERSION}.tgz"
          done
