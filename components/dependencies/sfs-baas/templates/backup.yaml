{{- range $localID, $backup := .Values.backups }}
{{- if eq $backup.location $.Values.location }}
{{- if not $backup.scheduled }}

{{- $effectiveID := include "sfs-baas.spxEID" (dict "projectID" $.Values.projectID "localID" $localID) }}
---
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: {{ $effectiveID | quote }}
  namespace: velero-system
  labels:
    {{- include "sfs-baas.labels" $ | nindent 4 }}
    superphenix.net/resourceEffectiveID: {{ $effectiveID | quote }}
    superphenix.net/resourceLocalID: {{ $localID | quote }}
    superphenix.net/resourceName: {{ $backup.name | quote }}
    superphenix.net/backupType: {{ $backup.type | lower | quote }}
    superphenix.net/backupSourceAZ: {{ $.Values.location | quote }}
spec:
  # Cluster scoped resources to backup
  includedClusterScopedResources:
    {{- include "sfs-baas.clusterResources" (dict "backupType" ($backup.type | lower)) | nindent 4 }}

  # Namespace scoped resources to backup
  includedNamespaceScopedResources:
    {{- include "sfs-baas.namespaceResources" (dict "backupType" ($backup.type | lower)) | nindent 4 }}

  # Resources to target using label selectors
  labelSelector:
    matchLabels:
      {{- with $backup.labelSelector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      superphenix.net/organizationID: spx-{{ $.Values.organizationID }}
      superphenix.net/projectID: spx-{{ $.Values.projectID }}

  # Backups are scoped to the project
  includedNamespaces:
    - spx-{{ $.Values.projectID }}

  # Time to retain backups in hours
  #ttl: {{ printf "%dh0m0s" (min $backup.retention.expiryTime 960 | int) | quote }}

  # We want to snapshot the PVCs
  snapshotVolumes: true

  # We want the PVCs to be moved to the backup location
  snapshotMoveData: true

{{- end }}
{{- end }}
{{- end }}