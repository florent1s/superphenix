{{- range .Values.clusters }}
{{- if .enabled }}
{{- $cluster := .name }}
{{- range .objectStores }}
{{- $storeName := .name }}
{{- range .storageClasses }}
{{- $scName := .fullName | default (printf "%s.%s" $cluster .name) }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $scName | quote }}
provisioner: {{ $cluster }}.ceph.rook.io/bucket
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
parameters:
  objectStoreName: {{ printf "%s.%s" $cluster $storeName }}
  objectStoreNamespace: {{ $cluster }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
