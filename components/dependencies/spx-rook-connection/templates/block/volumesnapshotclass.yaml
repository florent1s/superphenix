{{- range .Values.clusters }}
{{- $cluster := .name }}
{{- $csi := .csi | default dict }}
{{- range .blockPools }}
{{- $pool := .name }}
{{- range .storageClasses }}

---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  {{- if not .fullName }}
  name: {{ $cluster }}.{{ .name }}
  {{- else }}
  name: {{ .fullName }}
  {{- end }}
  {{- if .default }}
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  {{- end }}
driver: {{ $.Values.rookOperatorNamespace }}.rbd.csi.ceph.com
parameters:
  clusterID: {{ .clusterID | default $cluster }}
  csi.storage.k8s.io/snapshotter-secret-name: {{ $csi.rbdProvisionerSecretName | default $cluster }}
  csi.storage.k8s.io/snapshotter-secret-namespace: {{ $csi.secretNamespace | default $cluster }}
deletionPolicy: {{ .reclaimPolicy | default "Delete" }}

{{- end }}
{{- end }}
{{- end }}