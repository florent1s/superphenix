apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "superphenix-controller.fullname" . }}
  labels:
    {{- include "superphenix-controller.labels" . | nindent 4 }}
data:
  config.yaml: |-
    {{- $config := .Values.superphenixController.config | default dict -}}
    {{- if .Values.webhook.enabled -}}
      {{- $tls := dict "enabled" true "address" ":8443" "certFile" "/etc/superphenix-controller/certs/tls.crt" "keyFile" "/etc/superphenix-controller/certs/tls.key" -}}
      {{- $http := default dict $config.http -}}
      {{- $_ := set $http "tls" $tls -}}
      {{- $_ := set $config "http" $http -}}
    {{- end -}}
    {{- toYaml $config | nindent 4 }}

