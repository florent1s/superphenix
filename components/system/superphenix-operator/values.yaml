replicaCount: 1

image:
  repository: harbor.agc.dpk-agc-cl04.agoracalyce.net/superphenix-operator/superphenix-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Operator configuration
config:
  isManagementCluster: true

  # General ConfigMap holding Helm values overrides for all management components.
  valuesConfigMap:
    name: superphenix-mgmt-values

  # ConfigMap where all clusters will append their configuration.
  clustersConfigMap:
    name: superphenix-clusters-config

  argocd:
    chart:
      url: https://argoproj.github.io/argo-helm
      version: 9.5.2
    ha:
      enabled: false
    # Arbitrary Helm values merged under the "argocd" ConfigMap key.
    values: {}

  management:
    chart:
      url: ghcr.io/super-phenix/charts
      version: 0.0.0
    # Arbitrary Helm values merged under the "superphenix" ConfigMap key.
    values: {}

  # System chart deployed by the cluster controller on every managed cluster.
  system:
    repoURL: ghcr.io/super-phenix/charts
    chartName: superphenix-system
    version: 0.0.0

# Metrics and Health
metrics:
  bindAddress: "0" # Disable by default
  secure: true

health:
  probeBindAddress: ":8081"

leaderElection:
  enabled: false
