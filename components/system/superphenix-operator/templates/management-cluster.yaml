{{- if .Values.management }}
{{- $cluster := .Values.management }}
apiVersion: operator.superphenix.net/v1alpha1
kind: Cluster
metadata:
  name: management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "superphenix-operator.labels" . | nindent 4 }}
    {{- with $cluster.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $cluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: Management
  region: {{ $cluster.region | default "management" }}
  availabilityZone: {{ $cluster.availabilityZone | default "management" }}
  {{- if $cluster.version }}
  version: {{ $cluster.version }}
  {{- end }}
  {{- if $cluster.systemLocation }}
  systemLocation:
    {{- toYaml $cluster.systemLocation | nindent 4 }}
  {{- end }}
  {{- if $cluster.systemConfiguration }}
  systemConfiguration:
    {{- toYaml $cluster.systemConfiguration | nindent 4 }}
  {{- end }}
  connection:
    mode: Local
  {{- if $cluster.lifecycle }}
  lifecycle:
    {{- toYaml $cluster.lifecycle | nindent 4 }}
  {{- end }}
{{- end }}
