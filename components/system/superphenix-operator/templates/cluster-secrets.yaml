{{- range $name, $cluster := .Values.clusters }}
{{- if and $cluster.connection (eq ($cluster.connection.mode | default "Local") "Remote") $cluster.connection.credentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-connection-creds" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "superphenix-operator.labels" $ | nindent 4 }}
    {{- with $cluster.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- with $cluster.connection.credentials }}
  {{- if .bearerToken }}
  bearerToken: {{ .bearerToken | quote }}
  {{- end }}
  {{- if .caData }}
  caData: {{ .caData | quote }}
  {{- end }}
  {{- if .certData }}
  certData: {{ .certData | quote }}
  {{- end }}
  {{- if .keyData }}
  keyData: {{ .keyData | quote }}
  {{- end }}
  {{- if .username }}
  username: {{ .username | quote }}
  {{- end }}
  {{- if .password }}
  password: {{ .password | quote }}
  {{- end }}
  {{- if hasKey . "insecure" }}
  insecure: {{ .insecure | quote }}
  {{- end }}
  {{- if .serverName }}
  serverName: {{ .serverName | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
